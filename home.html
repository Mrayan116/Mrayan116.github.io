<style>

  .home-wrap{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    background: radial-gradient(circle at 50% 0%, var(--bg-deep) 0%, var(--bg) 62%);
  }

  .home-card{
    text-align: center;
    max-width: 460px;
  }

  .home-photo {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    object-fit: cover;
    border: 7px solid var(--bg-card);
    box-shadow: 0 14px 34px rgba(58, 42, 23, 0.25);

    display: block;
    margin-left: auto;
    margin-right: auto;
}

  .home-name{
    margin-top: 28px;
    font-size: 2rem;
  }

  .home-role{
    margin-top: 8px;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }

  /* social icon row */
  .socials{
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  .social-btn{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    border: 2px solid var(--divider);
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
  }

  .social-btn svg{
    width: 19px;
    height: 19px;
    fill: currentColor;
  }

  .social-btn:hover{
    transform: scale(1.3);
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 8px 18px rgba(200, 80, 31, 0.4);
    border-color: var(--accent);
  }

  .social-btn:focus-visible{
    outline: 2px solid var(--teal);
    outline-offset: 3px;
  }

  /* section links */
  .section-links{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 44px;
  }

  .section-links a{
    padding: 12px 26px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 2px solid var(--divider);
    font-weight: 600;
    font-size: 0.98rem;
    transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .section-links a:hover{
    transform: translateY(-3px) scale(1.04);
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    box-shadow: 0 10px 20px rgba(200, 80, 31, 0.3);
  }

</style>
